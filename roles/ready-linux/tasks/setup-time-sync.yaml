###
### Setup Time Sync using Datetime Config
###

- name: Setup TimeZone Data
  community.general.timezone:
    name: "{{ machine_timezone }}"
  tags:
  - time-sync-setup

# ==========================================
# Ubuntu: NTP Transition
# ==========================================

- name: Disable systemd-timesyncd (Ubuntu)
  ignore_errors: true
  systemd:
    name: systemd-timesyncd
    enabled: no
    state: stopped
    masked: yes
  when:
  - target_os == "ubuntu"
  tags:
  - time-sync-setup

- name: Disable and stop conflicting chrony service (Ubuntu)
  ignore_errors: true
  systemd:
    name: chrony
    enabled: no
    state: stopped
  when:
  - target_os == "ubuntu"
  tags:
  - time-sync-setup

- name: Purge conflicting chrony package (Ubuntu)
  apt:
    name: chrony
    state: absent
    purge: yes
  when:
  - target_os == "ubuntu"
  tags:
  - time-sync-setup

- name: Ensure Ubuntu NTP Packages are installed
  apt:
    pkg:
    - ntp
    - ntpdate
    state: present
    update_cache: yes
  when:
  - target_os == "ubuntu"
  tags:
  - time-sync-setup

- name: Template ntp.conf (Ubuntu)
  template:
    src: ntp.conf.j2
    dest: /etc/ntp.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart ntp
  when:
  - target_os == "ubuntu"
  tags:
  - time-sync-setup

- name: Perform one-time initial ntp time stepping sync (Ubuntu)
  shell: |
    systemctl stop ntp || true
    ntpd -gq
  ignore_errors: true
  when:
  - target_os == "ubuntu"
  tags:
  - time-sync-setup

- name: Ensure ntp service is started and enabled (Ubuntu)
  systemd:
    name: ntp
    state: started
    enabled: yes
  when:
  - target_os == "ubuntu"
  tags:
  - time-sync-setup

# ==========================================
# RedHat/CentOS: Chronyd Safe Fallback
# ==========================================

- name: Ensure chrony is started and enabled (RedHat)
  systemd:
    name: chronyd
    state: started
    enabled: yes
  when:
  - target_os == "redhat"
  tags:
  - time-sync-setup

# ==========================================
# Post-Sync Verification
# ==========================================

- name: Wait for system clock to synchronize
  command: timedatectl status
  register: timedatectl_out
  until: "'System clock synchronized: yes' in timedatectl_out.stdout"
  retries: 30
  delay: 5
  changed_when: false
  tags:
  - time-sync-setup
