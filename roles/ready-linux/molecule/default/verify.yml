---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  # ==========================================
  # Debian/Ubuntu Assertions (Chrony)
  # ==========================================
  - name: Check if chrony is installed (Ubuntu)
    package:
      name: chrony
      state: present
    check_mode: yes
    register: chrony_install
    failed_when: chrony_install.changed
    when: ansible_os_family == 'Debian'

  - name: Check if chrony service is running (Ubuntu)
    service:
      name: chrony
      state: started
    check_mode: yes
    register: chrony_service
    failed_when: chrony_service.changed
    when: ansible_os_family == 'Debian'

  - name: Verify systemd-timesyncd is stopped (Ubuntu)
    service:
      name: systemd-timesyncd
      state: stopped
    check_mode: yes
    register: timesyncd_service
    failed_when: timesyncd_service.changed
    when: ansible_os_family == 'Debian'

  - name: Verify ntp is absent (Ubuntu)
    package:
      name: ntp
      state: absent
    check_mode: yes
    register: ntp_uninstall
    failed_when: ntp_uninstall.changed
    when: ansible_os_family == 'Debian'

  # ==========================================
  # RedHat/CentOS Assertions (Chrony Fallback)
  # ==========================================
  - name: Check if chrony is installed (RedHat)
    package:
      name: chrony
      state: present
    check_mode: yes
    register: chrony_install_rhel
    failed_when: chrony_install_rhel.changed
    when: ansible_os_family == 'RedHat'

  - name: Check if chrony service is running (RedHat)
    service:
      name: chronyd
      state: started
    check_mode: yes
    register: chrony_service_rhel
    failed_when: chrony_service_rhel.changed
    when: ansible_os_family == 'RedHat'
